decoration {
    rounding = 10
    active_opacity = 0.96
    inactive_opacity = 0.9
    fullscreen_opacity = 1

    blur {
        enabled = true
        size = 3
        passes = 5
        new_optimizations = true
        ignore_opacity = true
        xray = false
        popups = true
    }

    shadow {
        enabled = true
        range = 15
        render_power = 2
        color = rgba(0,0,0,.1)
    }
}
