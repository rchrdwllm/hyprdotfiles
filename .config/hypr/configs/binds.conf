$mainMod = SUPER

bind = $mainMod, RETURN, exec, $terminal
bind = $mainMod, C, exec, capacities
bind = $mainMod, D, exec, $menu
bind = $mainMod, F, exec, $gui_file_manager
bind = $mainMod, B, exec, $browser
bind = $mainMod, L, exec, $lockscreen
bind = $mainMod, V, exec, $gui_editor
bind = $mainMod SHIFT, V, exec, $editor
bind = $mainMod, Q, killactive
bind = $mainMod, X, exec, wlogout -b 4 -m 400px
bind = $mainMod SHIFT, RETURN, exec, $file_manager
bind = $mainMod SHIFT, R, exec, hyprctl reload
bind = $mainMod SHIFT, E, exit,
bind = $mainMod SHIFT, SPACE, togglefloating,
bind = $mainMod SHIFT, O, exec, ~/.config/waybar/scripts/waybar_restart.sh
bind = $mainMod SHIFT, W, exec, ~/.config/hypr/scripts/wallpaper.sh
bind = $mainMod, W, exec, ~/.config/hypr/scripts/random_wallpaper.sh
bind = $mainMod SHIFT, N, exec, swaync-client -t -sw
bind = $mainMod SHIFT, F, fullscreen, 0
bind = $mainMod, P, pseudo, # dwindle
bind = $mainMod, J, togglesplit, # dwindle

# Media controls
bind = , XF86AudioPlay, exec, playerctl play-pause
bind = , XF86AudioPause, exec, playerctl play-pause
bind = , XF86AudioNext, exec, playerctl next
bind = , XF86AudioPrev, exec, playerctl previous

# Brightness and volume controls
bind = , xf86monbrightnessup, exec, ~/.config/hypr/scripts/brightness --inc
bind = , xf86monbrightnessdown, exec, ~/.config/hypr/scripts/brightness --dec
bind = , xf86audioraisevolume, exec, ~/.config/hypr/scripts/volume --inc
bind = , xf86audiolowervolume, exec, ~/.config/hypr/scripts/volume --dec

# Screenshot binds
bind = , Print, exec, hyprshot -m region -o ~/Pictures/Screenshots
bind = $mainMod, Print, exec, hyprshot -m active -m output -o ~/Pictures/Screenshots
bind = CTRL SHIFT, Print, exec, hyprshot -m window -o ~/Pictures/Screenshots

# Game mode
bind = $mainMod, F1, exec, ~/.config/hypr/scripts/gamemode.sh

# Move focus with mainMod + arrow key
bind = $mainMod, left, movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up, movefocus, u
bind = $mainMod, down, movefocus, d

# Move window with mainMod + Shift + arrow key
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# Resize window with Ctrl + mainMod + arrow key
bind = CTRL $mainMod, right, resizeactive, 50 0
bind = CTRL $mainMod, left, resizeactive, -50 0
bind = CTRL $mainMod, down, resizeactive, 0 50
bind = CTRL $mainMod, up, resizeactive, 0 -50

# Center window
bind = $mainMod SHIFT, C, centerwindow

# Switch workspaces with mainMod + [0-9]
bind = $mainMod, 1, workspace, 1
bind = $mainMod, 2, workspace, 2
bind = $mainMod, 3, workspace, 3
bind = $mainMod, 4, workspace, 4
bind = $mainMod, 5, workspace, 5
bind = $mainMod, 6, workspace, 6
bind = $mainMod, 7, workspace, 7
bind = $mainMod, 8, workspace, 8
bind = $mainMod, 9, workspace, 9
bind = $mainMod, 0, workspace, 10

# Move active window to a workspace with mainMod + SHIFT + [0-9]
bind = $mainMod SHIFT, 1, movetoworkspace, 1
bind = $mainMod SHIFT, 2, movetoworkspace, 2
bind = $mainMod SHIFT, 3, movetoworkspace, 3
bind = $mainMod SHIFT, 4, movetoworkspace, 4
bind = $mainMod SHIFT, 5, movetoworkspace, 5
bind = $mainMod SHIFT, 6, movetoworkspace, 6
bind = $mainMod SHIFT, 7, movetoworkspace, 7
bind = $mainMod SHIFT, 8, movetoworkspace, 8
bind = $mainMod SHIFT, 9, movetoworkspace, 9
bind = $mainMod SHIFT, 0, movetoworkspace, 10

bind = $mainMod CTRL, 1, movetoworkspacesilent, 1
bind = $mainMod CTRL, 2, movetoworkspacesilent, 2
bind = $mainMod CTRL, 3, movetoworkspacesilent, 3
bind = $mainMod CTRL, 4, movetoworkspacesilent, 4
bind = $mainMod CTRL, 5, movetoworkspacesilent, 5
bind = $mainMod CTRL, 6, movetoworkspacesilent, 6
bind = $mainMod CTRL, 7, movetoworkspacesilent, 7
bind = $mainMod CTRL, 8, movetoworkspacesilent, 8
bind = $mainMod CTRL, 9, movetoworkspacesilent, 9
bind = $mainMod CTRL, 0, movetoworkspacesilent, 10

# Scroll through existing workspaces with mainMod + scroll
bind = $mainMod, mouse_down, workspace, e+1
bind = $mainMod, mouse_up, workspace, e-1

# Move/resize windows with mainMod + LMB/RMB and dragging
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow
